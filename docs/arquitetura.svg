  <text x="92" y="663" class="font" font-size="13.5" fill="#CBD5E1">Reconciliação granular (FULL OUTER JOIN) e regras de exclusão/saldo</text>
  <rect x="632" y="569" width="536" height="124" rx="9" fill="#0E1726" stroke="#24344D" stroke-width="1.2"/>
