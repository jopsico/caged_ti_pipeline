version: 2

models:
  - name: dim_cbo
    description: "Dimensão de ocupações (CBO 2002) pertencentes ao escopo de TI"
    columns:
      - name: cbo_ocupacao
        description: "Código de 6 dígitos da CBO 2002"
        tests:
          - unique
          - not_null
      - name: nome_ocupacao
        tests:
          - not_null
      - name: familia_cbo
        tests:
          - not_null

  - name: fato_movimentacoes_ti
    description: "Tabela fato de movimentações formais em TI no Novo CAGED (MOV + FOR - EXC)"
    columns:
      - name: competencia_mov
        tests:
          - not_null
      - name: uf_codigo
        tests:
          - not_null
      - name: cbo_ocupacao
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cbo')
                field: cbo_ocupacao
      - name: saldo_ajustado
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [-1, 1]
                quote: false
  - name: agg_caged_ti_mensal
    description: "Agregado mensal (competencia x recorte geografico x nivel de carreira)"
    columns:
      - name: competencia_mov
        tests:
          - not_null
      - name: recorte_geografico
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Ceará', 'Resto do Nordeste', 'Resto do Brasil']
      - name: nivel_carreira
        tests:
          - not_null
      - name: total_admissoes
        tests:
          - not_null
      - name: total_desligamentos
        tests:
          - not_null
      - name: saldo_liquido
        tests:
          - not_null
      - name: admissoes_jovens_ate_24
        tests:
          - not_null
